# Construit le site (Vite) et le publie sur GitHub Pages : à chaque push sur main, à la demande, et dès qu'une
# application publie une nouvelle version (vérification toutes les heures, redéploiement seulement si ça a changé).
# Prérequis, une seule fois :
#   - Settings → Pages → Build and deployment → Source : « GitHub Actions ».
#   - Settings → Secrets and variables → Actions : secret RELEASES_TOKEN = token fine-grained en lecture seule
#     (« Contents: read ») sur les dépôts des projets, pour lire leurs releases (dépôts privés compris).
#     Sans ce secret, le build garde src/data/releases.json tel qu'il est dans le dépôt.
name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Versions des projets relues toutes les heures (à la 23e minute ; GitHub peut décaler un peu).
  schedule:
    - cron: '23 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write # notification « nouvelle version en ligne » (ticket ouvert puis fermé : GitHub envoie l'e-mail)

# Un déploiement à la fois ; les suivants attendent (une vérification horaire n'annule jamais un déploiement en cours).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Passage programmé : compare l'empreinte des releases à celle du site en ligne (releases-signature.txt).
  # Identiques → rien à faire ; différentes (nouvelle version, notes modifiées) → build et déploiement.
  check:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Le script n'a pas de dépendance npm : pas besoin de npm ci ici.
      - run: node scripts/fetch-releases.mjs
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
      - id: compare
        run: |
          now=$(jq -S .repos src/data/releases.json | sha256sum | cut -d' ' -f1)
          live=$(curl -fsSL https://nevennit.github.io/releases-signature.txt || echo absent)
          echo "En ligne : $live"
          echo "Actuel   : $now"
          if [ "$now" = "$live" ]; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi

  build:
    needs: check
    outputs:
      new: ${{ steps.versions.outputs.new }}
    # Toujours pour un push ou un lancement manuel ; pour le passage programmé, seulement si les versions ont changé.
    if: ${{ !cancelled() && (github.event_name != 'schedule' || needs.check.outputs.changed == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Dernières releases de chaque projet ; n'échoue jamais (avertissement et fichier existant conservé).
      - run: npm run releases
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
      # Empreinte des releases publiée avec le site : la vérification horaire la compare.
      - run: jq -S .repos src/data/releases.json | sha256sum | cut -d' ' -f1 > public/releases-signature.txt
      # Versions publiées (public/versions.json) et liste des nouvelles depuis le site en ligne, pour la notification.
      - id: versions
        run: |
          curl -fsSL https://nevennit.github.io/versions.json -o "$RUNNER_TEMP/live-versions.json" || true
          node scripts/version-diff.mjs "$RUNNER_TEMP/live-versions.json"
      # Captures envoyées depuis Pages CMS en PNG/JPG : converties en WebP (références mises à jour pour ce build).
      - run: npm run images
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Une notification par nouvelle version en ligne : un ticket ouvert puis aussitôt fermé dans ce dépôt.
  # GitHub l'envoie par e-mail (à condition de « suivre » le dépôt : Watch → All Activity, voir le guide).
  notify:
    needs: [build, deploy]
    if: ${{ !cancelled() && needs.deploy.result == 'success' && needs.build.outputs.new != '' && needs.build.outputs.new != '[]' }}
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW: ${{ needs.build.outputs.new }}
        run: |
          echo "$NEW" | jq -c '.[]' | while read -r v; do
            title=$(echo "$v" | jq -r '.title'); tag=$(echo "$v" | jq -r '.tag'); id=$(echo "$v" | jq -r '.id')
            body="La version **$tag** de **$title** est maintenant affichée sur le portfolio : https://nevennit.github.io/#/projet/$id

          Suivi de toutes les versions : https://nevennit.github.io/#/suivi"
            url=$(gh issue create -R "$GITHUB_REPOSITORY" --title "$title $tag en ligne" --body "$body")
            gh issue close "$url" --reason completed
          done
